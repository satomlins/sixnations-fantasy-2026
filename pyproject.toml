[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "pandas>=3.0.0",
    "requests>=2.32.5",
    "python-dotenv>=1.0.0",
    "dash>=2.17.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.20.0",
    "duckdb>=1.0.0",
]

[project.scripts]
fantasysn-dashboard = "app:main"
fantasysn-ingest = "fantasy_ingest:main"

[tool.setuptools]
py-modules = ["app", "fantasy_ingest"]

[tool.uv]
package = true
